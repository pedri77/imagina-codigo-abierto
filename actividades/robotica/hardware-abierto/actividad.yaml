lujo: true
avisos_docente:
  - "Actividad de lujo: necesita placas Arduino compatibles y componentes, unos 60-70 € de equipo por grupo de 12 que se reutiliza en las cuatro actividades con Arduino. Confírmalo con dirección antes de programarla."
  - "La primera vez, el coordinador TIC instala el entorno de Arduino y el controlador USB de las placas (a menudo CH340). Sin placas o sin instalación, usa el simulador web Wokwi."
  - "Plan B sin conexión: si el centro instala SimulIDE (simulador de código abierto que funciona sin internet), la prueba de las dos luces se puede hacer en él. La parte de detectives necesita al menos una placa por cada dos parejas, o una ampliación grande de la foto de la placa en la ficha oficial."
