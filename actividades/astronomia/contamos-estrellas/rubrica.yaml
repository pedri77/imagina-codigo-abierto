niveles: [Empezando, En camino, Lo consigo, Lo amplío]
criterios:
  - nombre: Escala de magnitudes
    descriptores:
      - Dice que la estrella con el número más grande es la que más brilla.
      - Ordena bien dos estrellas por brillo con la tabla delante, con ayuda del adulto.
      - Ordena las estrellas de la tabla de más a menos brillo y explica que menor número es más brillo.
      - Explica que cada paso de magnitud es unas 2,5 veces menos luz y lo usa para comparar dos estrellas.
  - nombre: Cartas de referencia
    descriptores:
      - Dibuja estrellas sin seguir la tabla ni el límite de la carta.
      - Hace una carta correcta y en las otras se le cuelan o le faltan estrellas.
      - Hace las cartas con las estrellas correctas para cada límite y el tamaño del punto según el brillo.
      - Comprueba las cartas de otra pareja con la tabla y señala los errores con el dato que lo demuestra.
  - nombre: Medir y decidir con datos
    descriptores:
      - Elige carta para un cielo misterioso al azar.
      - Elige la carta que más se parece pero no sabe decir por qué.
      - Elige la carta contando las estrellas que ve y lo dice en voz alta.
      - Explica por qué con la farola encendida cambia su respuesta y qué estrellas desaparecen primero.
  - nombre: Compartir y colaborar
    descriptores:
      - No coloca su dato en el mapa o lo coloca sin mirar el resto.
      - Coloca su dato cuando el adulto se lo recuerda.
      - Coloca su dato y describe el patrón que forman todos juntos.
      - Explica por qué un dato solo no basta y propone cómo conseguir más datos o mejores.
