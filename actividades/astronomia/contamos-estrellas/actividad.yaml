avisos_docente:
  - "La observación es nocturna y va como proyecto a casa con la familia. En clase no se recoge la ubicación de nadie: solo la carta elegida y si había nubes."
  - "El envío a Globe at Night es voluntario y lo hace un adulto de la familia desde su dispositivo, nunca el alumnado con cuenta propia. No pide cuenta: pide fecha, hora, lugar de la observación, carta elegida y nubes. El correo de SciStarter que ofrece al final es opcional y no hace falta. Recomienda a las familias indicar un punto público cercano (una plaza, un parque) en vez de la dirección de casa, porque los datos se publican."
  - "Las fechas de campaña cambian cada año y conviene programar la sesión unos días antes de una ventana de campaña. Consúltalas en la página de campañas de Globe at Night."
