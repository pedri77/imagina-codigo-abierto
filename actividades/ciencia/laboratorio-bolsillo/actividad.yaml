avisos_docente:
  - "Instalación previa: el coordinador TIC debe instalar phyphox (gratuita, sin cuenta, licencia GPL-3.0) en las tablets del centro al menos una semana antes y comprobar que la aplicación tiene permiso de micrófono."
  - Hacen falta 6 tablets (2 por estación) con micrófono y acelerómetro. Casi todas las tablets los tienen; compruébalo abriendo los experimentos «Cronómetro acústico» e «Inclinación».
  - "Privacidad: según la descripción y el código publicado del experimento y la política de privacidad de phyphox (consultadas en octubre de 2026), el cronómetro acústico solo guarda en memoria una fracción de segundo de sonido para detectar los golpes y no crea archivos de grabación; los datos se quedan en la tablet salvo que se exporten. No lo hemos comprobado en todas las versiones: pide al coordinador TIC que lo confirme en la versión instalada. En el aula, no se usa «Exportar» ni «Acceso remoto» y se pulsa «Borrar datos» al terminar."
  - "Norma por defecto, modificable por el centro: las tablets no salen del aula y no se instala ninguna otra aplicación durante la sesión."
